# 대상 레포의 .github/workflows/gto.yml 로 복사.
# lib.mjs, sync.mjs, worklog.mjs 는 .github/gto/ 아래에 복사. (의존성 없음)
# 프로필은 레포 Variable GTO_PROFILE(JSON)로 넣거나 .github/gto/profiles/*.json 으로 둔다.
# 기존 issue-to-jira.yml은 삭제 (둘 다 있으면 Jira 이슈가 중복 생성됨)
name: gto

on:
  issues:
    # labeled: 동기화 라벨을 나중에 붙여도 반영. 앱은 하위 이슈를 상위에 연결한 뒤 라벨을 붙인다 (그래야 하위 작업으로 만들어짐)
    types: [opened, edited, closed, reopened, milestoned, demilestoned, labeled]
  milestone:
    types: [created, edited, closed, opened]
  push:
    branches: ['**'] # 모든 브랜치. 커밋의 #이슈번호로 이슈를 찾으므로 브랜치를 가리지 않음

permissions:
  contents: read
  issues: write
  pull-requests: read # 커밋이 PR 머지로 생긴 것인지 확인, 커밋의 #번호가 PR일 때 조회

env:
  GTO_PROFILE: ${{ vars.GTO_PROFILE }}
  JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
  JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
  GH_TOKEN: ${{ github.token }}

jobs:
  # F1: 이슈/마일스톤 → Jira
  sync:
    if: github.event_name == 'issues' || github.event_name == 'milestone'
    runs-on: ubuntu-latest
    # 같은 이슈/마일스톤 이벤트는 순서대로 (생성 직후 milestoned가 겹쳐 중복 생성되는 것 방지)
    concurrency:
      group: gto-${{ github.event.issue.number || format('m{0}', github.event.milestone.number) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout: .github/gto }
      - run: node .github/gto/sync.mjs

  # F3: push된 커밋 목록을 이슈별로 GitHub 이슈 본문 "작업 내용" 칸에 덧붙이고, 바로 Jira로 동기화 (요약은 앱에서)
  worklog:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { sparse-checkout: .github/gto }
      - run: node .github/gto/worklog.mjs
